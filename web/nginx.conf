server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html isn't content-hashed and names the current bundles, so never
    # cache it, or returning visitors get pinned to an old build.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Vite content-hashes everything in assets/, so those URLs never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
